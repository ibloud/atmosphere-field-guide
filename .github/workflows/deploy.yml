name: Deploy Atmosphere guide
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: atmosphere-pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch maintained PIXIE guide
        uses: actions/checkout@v4
        with:
          repository: ibloud/pixie-device-stewardship
          ref: main
          path: upstream
          persist-credentials: false
      - name: Check actual public release
        id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          source=$(git -C upstream rev-parse HEAD)
          if [ "$EVENT" = schedule ] && python tools/verify-publication.py live --source "$source" --wrapper "$GITHUB_SHA"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.publish == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: upstream/tools/atmosphere-guide/package-lock.json
      - name: Supply original guide images
        if: steps.check.outputs.publish == 'true'
        run: |
          mkdir -p upstream/tools/atmosphere-guide/public/assets
          cp upstream/assets/atmosphere-orbit.jpg upstream/tools/atmosphere-guide/public/assets/
          cp upstream/assets/made-sick-icon.svg upstream/tools/atmosphere-guide/public/assets/
      - name: Build maintained guide
        if: steps.check.outputs.publish == 'true'
        working-directory: upstream/tools/atmosphere-guide
        run: |
          npm ci
          npm run build
      - name: Test publication verifier
        run: python -m unittest discover -s tools -p 'test_publication.py' -v
      - name: Prepare and verify publication
        if: steps.check.outputs.publish == 'true'
        run: |
          python tools/prepare-guide.py
          python tools/verify-publication.py build --source "$(git -C upstream rev-parse HEAD)" --wrapper "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.publish == 'true' && github.event_name != 'pull_request'
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: upstream/tools/atmosphere-guide/dist/client
      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.publish == 'true' && github.event_name != 'pull_request'
        with:
          name: release-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: upstream/tools/atmosphere-guide/dist/client/publication-manifest.json
  deploy:
    if: github.event_name != 'pull_request' && needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-proof
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify public content against exact build
        run: python tools/verify-publication.py live --expected release-proof/publication-manifest.json --attempts 8
